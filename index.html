<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wano Arc (One Pace) Progress</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0e0e0e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #ffcc00;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .wano-image {
      max-width: 100%;
      max-height: 400px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    .progress-container {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }

    .progress-label {
      margin-bottom: 10px;
      text-align: center;
    }

    .progress-bar {
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 30px;
      background-color: #ff0000;
      width: 0%;
      text-align: center;
      line-height: 30px;
      color: #fff;
      font-weight: bold;
      transition: width 0.5s;
    }

    .episode-info {
      margin-top: 20px;
      font-size: 1.2em;
      text-align: center;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <h1>One Pace: Wano Arc Progress</h1>

  <!-- 👇 Your Whitebeard image -->
  <img src="8644a017-77e7-4fcd-adef-79ba3025cab1.png" alt="Whitebeard - The One Piece is Real" class="wano-image" />

  <div class="progress-container">
    <div class="progress-label">Watching Episode <span id="current-ep">4</span> of 95</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-bar">0%</div>
    </div>
    <div class="episode-info">Wano Arc (One Pace): Episodes 1–95</div>
  </div>

    <footer id="last-updated">Last updated: </footer>

  <script>
    const startEp = 1;
    const endEp = 95;
    const currentEp = 4; // 👈 CHANGE THIS when you make progress

    const progress = ((currentEp - startEp) / (endEp - startEp)) * 100;
    const progressBar = document.getElementById('progress-bar');
    const currentEpSpan = document.getElementById('current-ep');

    progressBar.style.width = `${progress}%`;
    progressBar.textContent = `${Math.floor(progress)}%`;
    currentEpSpan.textContent = currentEp;

    // Update Last Updated Timestamp in 12-hour EST format
    function formatDateEST(date) {
      const options = {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      };
      return new Intl.DateTimeFormat('en-US', options).format(date) + ' EST';
    }

    const footer = document.getElementById('last-updated');
    const now = new Date();
    footer.textContent = `Last updated: ${formatDateEST(now)}`;
  </script>


  <script>
    const startEp = 1;
    const endEp = 95;
    const currentEp = 4; // 👈 CHANGE THIS when you make progress

    const progress = ((currentEp - startEp) / (endEp - startEp)) * 100;
    const progressBar = document.getElementById('progress-bar');
    const currentEpSpan = document.getElementById('current-ep');

    progressBar.style.width = `${progress}%`;
    progressBar.textContent = `${Math.floor(progress)}%`;
    currentEpSpan.textContent = currentEp;
  </script>

</body>
</html>

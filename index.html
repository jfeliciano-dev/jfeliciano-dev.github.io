<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wano Arc Progress - One Pace</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0e0e0e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #ffcc00;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
      text-align: center;
    }

    .wano-image {
      max-width: 100%;
      max-height: 400px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    .progress-container {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }

    .progress-label {
      margin-bottom: 10px;
      text-align: center;
    }

    .progress-bar {
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 30px;
      background-color: #ff0000;
      width: 0%;
      text-align: center;
      line-height: 30px;
      color: #fff;
      font-weight: bold;
      transition: width 0.5s;
    }

    .episode-info {
      margin-top: 20px;
      font-size: 1.2em;
      text-align: center;
    }

    .audio-player {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
    }

    .audio-player button {
      background-color: #ff0000;
      color: #fff;
      border: none;
      padding: 6px 14px;
      font-size: 1em;
      border-radius: 6px;
      cursor: pointer;
    }

    .audio-player input[type="range"] {
      width: 150px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <h1>One Piece: Wano Arc Progress (One Pace)</h1>

  <!-- Whitebeard Image -->
  <img src="8644a017-77e7-4fcd-adef-79ba3025cab1.png" alt="Whitebeard - The One Piece is Real" class="wano-image" />

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-label">Watching Episode <span id="current-ep">4</span> of 95</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-bar">0%</div>
    </div>
    <div class="episode-info">Wano Arc (One Pace): Episodes 1–95</div>
  </div>

  <!-- Audio Player -->
  <div class="audio-player">
    <button id="play-pause">Play</button>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" />
    <audio id="wano-audio" preload="auto">
      <source src="over-the-top.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
  </div>

  <!-- Footer -->
  <footer id="last-updated">Last updated: </footer>

  <script>
    // Episode progress
    const startEp = 1;
    const endEp = 95;
    const currentEp = 4; // 👈 Update this number as you watch more episodes

    const progress = ((currentEp - startEp) / (endEp - startEp)) * 100;
    const progressBar = document.getElementById('progress-bar');
    const currentEpSpan = document.getElementById('current-ep');

    progressBar.style.width = `${progress}%`;
    progressBar.textContent = `${Math.floor(progress)}%`;
    currentEpSpan.textContent = currentEp;

    // Last updated timestamp in 12-hour EST format
    function formatDateEST(date) {
      const options = {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      };
      return new Intl.DateTimeFormat('en-US', options).format(date) + ' EST';
    }

    const footer = document.getElementById('last-updated');
    footer.textContent = 'Last updated: August 7, 2025, 11:24 AM EST';

    // Audio controls
    const audio = document.getElementById('wano-audio');
    const playPauseBtn = document.getElementById('play-pause');
    const volumeSlider = document.getElementById('volume');

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playPauseBtn.textContent = 'Pause';
      } else {
        audio.pause();
        playPauseBtn.textContent = 'Play';
      }
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
    });

    // Set default volume
    audio.volume = 0.5;
  </script>

</body>
</html>
